<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>랠리 · 로그인</title><link rel="stylesheet" href="/login.css"><script src="/login.js" defer></script></head><body><main><section class="intro"><a class="brand" href="/">◉ 랠리 <small>RALLY</small></a><div class="intro-copy"><span>YOUR TIME ON COURT</span><h1>좋은 레슨의 시작,<br>일정부터 편하게.</h1><p>레슨과 코트에 집중할 수 있도록.<br>나의 일정이 기다리는 곳, 랠리.</p></div><div class="court" aria-hidden="true"><i></i></div><footer>프로 테니스 아카데미 · 2호점</footer></section><section class="panel"><div class="form-wrap"><span class="eyebrow">WELCOME BACK</span><h2>반가워요, 다시 만나네요.</h2><p>등록된 계정으로 로그인해 주세요.</p><form id="login-form"><label for="email">이메일</label><input type="email" id="email" name="email" autocomplete="username" placeholder="coach@example.com" maxlength="254" required><div class="password-label"><label for="password">비밀번호</label><button type="button" id="toggle-password" aria-label="비밀번호 표시" aria-pressed="false">표시</button></div><input type="password" id="password" name="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요" maxlength="256" required><p id="error" role="alert"></p><button class="submit" type="submit" id="submit">로그인 →</button></form><div class="help">계정이 없거나 비밀번호를 잊으셨나요?<br><strong>테니스장 운영자에게 문의해 주세요.</strong></div><p class="note">로그인하면 계정에 지정된 화면으로 이동합니다.</p></div></section></main></body></html>
