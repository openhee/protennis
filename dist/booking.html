<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>랠리 · 레슨 예약</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f4;color:#293d33;font:15px Arial,'Malgun Gothic',sans-serif}main{max-width:1000px;margin:auto;padding:28px 20px}header,.tools{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:28px}h2{font-size:18px}p{color:#708076;line-height:1.7}button,input,select{font:inherit;padding:11px;border:1px solid #d7e1d8;border-radius:8px;background:white;color:#245641}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}section{background:white;border:1px solid #e1e8e0;border-radius:14px;padding:22px;margin:20px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid #edf0eb;padding:16px 0}.row div{line-height:1.8}form{display:flex;flex-wrap:wrap;gap:12px;align-items:end}label{display:grid;gap:8px;font-size:13px}.primary{background:#245641;color:white}#message{padding:12px;min-height:40px}a{color:#245641}dialog{border:0;border-radius:16px;padding:26px;max-width:440px;width:90%}dialog::backdrop{background:#0005}[hidden]{display:none!important}:focus-visible{outline:3px solid #8ca953;outline-offset:3px}
</style></head><body><main><header><a href="/">← 내 화면</a><span id="identity"></span><button id="logout">로그아웃</button></header><h1>레슨 예약</h1><p>실제 등록된 시간과 예약을 관리합니다.</p><div class="tools"><label>조회 시작일<input type="date" id="day"></label><button id="reload">7일 일정 조회</button></div><p id="message" role="status"></p><section id="pass-area" hidden><h2>내 수강권</h2><div id="passes"></div><label>예약에 사용할 수강권<select id="pass"></select></label></section><section id="create-area" hidden><h2>예약 시간 열기 / 차단</h2><form id="create"><label>상태<select id="action"><option value="open">예약 가능</option><option value="block">예약 불가</option></select></label><label>상품<select id="product"></select></label><label>시작<input id="start" type="datetime-local" required></label><label>종료<input id="end" type="datetime-local" required></label><button class="primary">등록</button></form><p>한국 시간 기준입니다. 1:1 상품의 수업 길이에 맞춰 등록하세요.</p></section><section><h2>레슨 시간</h2><div id="entries"></div></section><section><h2>확정 예약</h2><div id="bookings"></div></section><p>예약하면 잔여 횟수 중 1회를 확보합니다. 출석 차감·취소·보강은 아직 연결 전입니다.</p></main><dialog id="confirm"><h2>이 시간에 예약할까요?</h2><p id="summary"></p><button id="cancel">닫기</button><button id="submit" class="primary">예약 확정</button></dialog><script>
document.addEventListener('DOMContentLoaded',()=>{
 const $=id=>document.getElementById(id),session=window.RALLY_SESSION;let dashboard,pending,busy=false;
 const node=(tag,text)=>{const el=document.createElement(tag);el.textContent=text;return el;};
 const format=value=>new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'long',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(value));
 $('identity').textContent=session.name+' · '+(session.role==='coach'?'코치':'레슨생');
 $('day').value=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date());
 $('create-area').hidden=session.role!=='coach';$('pass-area').hidden=session.role!=='student';
 async function api(url,body){const response=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{cache:'no-store'});if(response.status===401){location.replace('/login.html');throw Error('다시 로그인해 주세요.');}const result=await response.json();if(!response.ok)throw Error(result.error||'요청 실패');return result;}
 async function load(){if(busy)return;busy=true;$('reload').disabled=true;$('message').textContent='불러오는 중…';try{
 dashboard=await api('/api/booking-dashboard?day='+$('day').value);$('entries').replaceChildren();$('bookings').replaceChildren();$('passes').replaceChildren();const selected=$('pass').value;$('pass').replaceChildren();$('product').replaceChildren();
 for(const p of dashboard.products){const o=node('option',p.name);o.value=p.id;$('product').append(o);}
 for(const p of dashboard.passes){$('passes').append(node('p',p.name+' · '+p.from+' ~ '+p.until+' · 잔여 '+p.remaining+'회 / 예약 확보 '+p.held+'회 / 예약 가능 '+Math.max(0,p.remaining-p.held)+'회'));const o=node('option',p.name);o.value=p.id;$('pass').append(o);}if(dashboard.passes.some(p=>p.id===selected))$('pass').value=selected;
 for(const e of dashboard.entries){const row=node('div','');row.className='row';row.append(node('div',format(e.start)+' — '+format(e.end)+' · '+e.coach+' · '+(e.type==='blocked'?'예약 불가':e.full?'예약 마감':'예약 가능')));if(session.role==='student'){const b=node('button','예약하기');b.disabled=e.full||new Date(e.start)<=new Date()||!dashboard.passes.length;b.onclick=()=>{pending={entry_id:e.id,pass_id:$('pass').value,request_id:crypto.randomUUID()};$('summary').textContent=format(e.start)+' · '+e.coach;$('confirm').showModal();};row.append(b);}$('entries').append(row);}
 for(const b of dashboard.bookings)$('bookings').append(node('p',format(b.start)+' · '+b.member+' · '+(b.status==='confirmed'?'예약 확정':'취소')));
 if(!dashboard.entries.length)$('entries').textContent='등록된 시간이 없습니다.';if(!dashboard.bookings.length)$('bookings').textContent='확정된 예약이 없습니다.';if(!dashboard.passes.length)$('passes').textContent='등록된 수강권이 없습니다.';$('message').textContent='최신 일정입니다.';
 }catch(error){$('message').textContent=error.message;}finally{busy=false;$('reload').disabled=false;}}
 $('reload').onclick=load;$('cancel').onclick=()=>$('confirm').close();
 $('submit').onclick=async()=>{if(!pending)return;$('submit').disabled=true;try{await api('/api/booking-action',{action:'reserve',payload:pending});$('confirm').close();pending=null;await load();$('message').textContent='예약이 확정되었습니다.';}catch(e){$('summary').textContent=e.message;}finally{$('submit').disabled=false;}};
 $('create').onsubmit=async event=>{event.preventDefault();const button=event.submitter;button.disabled=true;try{await api('/api/booking-action',{action:$('action').value,payload:{starts_at:$('start').value+':00+09:00',ends_at:$('end').value+':00+09:00',product_id:$('product').value}});await load();$('message').textContent='시간을 등록했습니다.';}catch(e){$('message').textContent=e.message;}finally{button.disabled=false;}};
 $('logout').onclick=async()=>{try{await api('/auth/logout',{});location.replace('/login.html');}catch(e){$('message').textContent=e.message;}};load();
});
</script></body></html>
